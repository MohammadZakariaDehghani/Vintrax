<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Atlas">
  <!-- The Atlas app mark.
       Pure geometry, no font and no gradient: it has to stay legible at 16px in
       a browser tab, survive a circular crop as a maskable icon, and read the
       same in one colour. The crossbar runs past the inner edge of both legs so
       it binds the letter together instead of floating inside it, and it carries
       the accent so the mark keeps two tones when everything else is flat. That
       accent is the dark-theme amber, not the light-theme one: the darker value
       goes muddy against this blue below about 32px. -->
  <rect width="512" height="512" rx="112" fill="#1c4c86"/>
  <path d="M158 372 L256 140 L354 372" fill="none" stroke="#ffffff" stroke-width="54"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M170 296 H342" fill="none" stroke="#e7aa40" stroke-width="42" stroke-linecap="butt"/>
</svg>
