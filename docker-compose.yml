# Full local stack: database, cache, object storage, search, API and web.
#
# `docker compose up -d postgres redis` brings up only what the API strictly
# needs — MinIO and OpenSearch are optional, because storage and search sit
# behind provider interfaces with local and PostgreSQL implementations.
#
# Every backing service publishes to 127.0.0.1 rather than 0.0.0.0. Docker
# publishes through its own NAT rules, which sit in front of the host firewall,
# so a bare '5432:5432' on a machine with a public interface is a database on
# the internet whether or not ufw is running. The API, web and mobile services
# do bind every interface, because a reverse proxy or another host has to reach
# them; nothing else does.

name: vintrax

services:
  postgres:
    image: postgres:16-alpine
    container_name: vintrax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vintrax
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vintrax}
      POSTGRES_DB: vintrax
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vintrax -d vintrax']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: vintrax-redis
    restart: unless-stopped
    # Append-only persistence so queued jobs survive a restart.
    #
    # Redis holds queued jobs and rate-limit counters, and it authenticates.
    # Left open it is a remote-code-execution primitive, not just a cache: an
    # unauthenticated client can rewrite the RDB path and drop a file anywhere
    # the server can write.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:-vintrax}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-vintrax}', '--no-auth-warning', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  # S3-compatible object storage. Optional: STORAGE_DRIVER=local writes to disk.
  minio:
    image: minio/minio:latest
    container_name: vintrax-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-vintraxadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-vintraxadmin}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 12
    profiles: ['storage', 'full']

  # Creates the bucket once MinIO is healthy, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-vintraxadmin} ${S3_SECRET_ACCESS_KEY:-vintraxadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-vintrax-media} &&
      mc anonymous set download local/${S3_BUCKET:-vintrax-media} &&
      echo 'MinIO bucket ready'
      "
    profiles: ['storage', 'full']

  # Optional dedicated search cluster. SEARCH_PROVIDER=postgres is the default
  # and needs none of this.
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: vintrax-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
      # Local development only. A real deployment terminates TLS and enables
      # the security plugin.
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health || exit 1']
      interval: 15s
      timeout: 10s
      retries: 12
    profiles: ['search', 'full']

  # Migrations, as a one-shot job the API waits on. Running them inside the
  # API's own command races with itself the moment there is more than one
  # replica, and a failed migration then crash-loops a container that keeps
  # retrying a schema change against a live database.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: vintrax-migrate
    restart: 'no'
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://vintrax:${POSTGRES_PASSWORD:-vintrax}@postgres:5432/vintrax?schema=public
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    container_name: vintrax-api
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 3001
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://vintrax:${POSTGRES_PASSWORD:-vintrax}@postgres:5432/vintrax?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-vintrax}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/backend/uploads
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-vintrax-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-vintraxadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-vintraxadmin}
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-postgres}
      OPENSEARCH_NODE: ${OPENSEARCH_NODE:-http://opensearch:9200}
      QUEUE_DRIVER: redis
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      MAIL_DRIVER: ${MAIL_DRIVER:-log}
    ports:
      - '3001:3001'
    volumes:
      - uploads-data:/app/backend/uploads

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
        # Next resolves rewrites() at build time into routes-manifest.json, so
        # the /api proxy destination is fixed here and not by the environment
        # variable of the same name below.
        API_ORIGIN: http://api:3001
    container_name: vintrax-web
    restart: unless-stopped
    init: true
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Read per request by serverFetch() for server components. The rewrite
      # destination is the build argument above; these are two different uses
      # of one name and both are needed.
      API_ORIGIN: http://api:3001
    ports:
      - '3000:3000'

  # Vintrax Mobile. A separate service on its own port so the existing web
  # container, its port and its build are untouched.
  mobile:
    build:
      context: .
      dockerfile: infrastructure/docker/mobile.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:3001}
        # Next resolves rewrites() at build time into routes-manifest.json, so
        # the /api proxy destination is fixed here and not by the environment
        # variable of the same name below.
        API_ORIGIN: http://api:3001
    container_name: vintrax-mobile
    restart: unless-stopped
    init: true
    depends_on:
      - api
    environment:
      NODE_ENV: production
      # Read per request for server-rendered data. The rewrite destination is
      # the build argument above.
      API_ORIGIN: http://api:3001
    ports:
      - '3002:3002'

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opensearch-data:
  uploads-data:
