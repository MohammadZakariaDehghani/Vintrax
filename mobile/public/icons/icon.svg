<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Vintrax">
  <!-- The Vintrax mark. Identical geometry to the web icon — one identity,
       two clients. See documentation/brand.md.

       The summit and the road, from the brand lockup.
       Simplified for small sizes — the lockup's notch in the peak and the
       tapering hairline of the road both disappear below about 48px, so they
       are not drawn here. What survives is the silhouette: a red peak crossed
       by a road sweeping to the horizon.
       The transform centres the composition in the tile; the artwork itself is
       drawn to the same coordinates in every variant. -->
  <rect width="512" height="512" rx="112" fill="#16295c"/>
  <g transform="translate(256 256) scale(1.1) translate(-256 -265)">
    <path d="M206 138 L108 392 L304 392 Z" fill="#d32027"/>
    <path d="M120 392 C180 322, 288 236, 404 172 C312 266, 250 322, 240 392 Z" fill="#ffffff"/>
  </g>
</svg>
