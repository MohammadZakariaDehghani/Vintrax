<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"
     role="img" aria-label="Atlas">
  <!-- Maskable variant.
       The launcher crops this to whatever shape it likes — a circle, a squircle,
       a rounded square — so the background bleeds to the full square with no
       corner radius of its own, and the mark is scaled to 80% to sit inside the
       safe zone (the middle 80%, which is all that is guaranteed to survive the
       crop). Everything else matches icon.svg. -->
  <rect width="512" height="512" fill="#1c4c86"/>
  <g transform="translate(256 256) scale(0.8) translate(-256 -256)">
    <path d="M158 372 L256 140 L354 372" fill="none" stroke="#ffffff" stroke-width="54"
          stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M170 296 H342" fill="none" stroke="#e7aa40" stroke-width="42" stroke-linecap="butt"/>
  </g>
</svg>
