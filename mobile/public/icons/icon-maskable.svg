<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable: the launcher may crop to a circle, so the mark sits inside the
       safe zone (the middle 80%) and the background bleeds to the full square. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c4f8a"/>
      <stop offset="100%" stop-color="#b7791f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <text x="256" y="330" font-family="system-ui,sans-serif" font-size="224" font-weight="800"
        fill="#fff" text-anchor="middle">A</text>
</svg>
