apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-mobile
  namespace: atlas
  labels: { app: atlas-mobile }
spec:
  # Fewer replicas than the web app: this serves a smaller audience and holds
  # no server-rendered data path of its own.
  replicas: 2
  selector:
    matchLabels: { app: atlas-mobile }
  template:
    metadata:
      labels: { app: atlas-mobile }
    spec:
      containers:
        - name: mobile
          # NEXT_PUBLIC_* values are baked in at build time, so the image tag
          # is what carries the API and WebSocket URLs — not this manifest.
          image: ghcr.io/atlas/mobile:latest
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: API_ORIGIN
              value: http://atlas-api:3001
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3002 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-mobile
  namespace: atlas
spec:
  selector: { app: atlas-mobile }
  ports:
    - port: 3002
      targetPort: 3002
