apiVersion: v1
kind: ConfigMap
metadata:
  name: vintrax-config
  namespace: vintrax
data:
  NODE_ENV: production
  API_PORT: '3001'
  APP_URL: https://vintrax.example.com
  CORS_ORIGINS: https://vintrax.example.com
  REDIS_URL: redis://vintrax-redis:6379
  QUEUE_DRIVER: redis
  STORAGE_DRIVER: s3
  S3_REGION: ca-central-1
  S3_BUCKET: vintrax-media
  S3_FORCE_PATH_STYLE: 'false'
  SEARCH_PROVIDER: opensearch
  OPENSEARCH_NODE: http://vintrax-opensearch:9200
  MAIL_DRIVER: resend
  MAIL_FROM: Vintrax <noreply@vintrax.ca>
  MAIL_REPLY_TO: support@vintrax.ca
  MAIL_NOTIFICATIONS_ENABLED: 'true'
  MAIL_MARKETING_ENABLED: 'true'
