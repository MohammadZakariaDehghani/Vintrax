apiVersion: apps/v1
kind: Deployment
metadata:
  name: vintrax-api
  namespace: vintrax
  labels: { app: vintrax-api }
spec:
  replicas: 3
  selector:
    matchLabels: { app: vintrax-api }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: vintrax-api }
    spec:
      # Migrations run once here rather than in the app container, so three
      # replicas starting together cannot race on the migration lock.
      initContainers:
        - name: migrate
          image: ghcr.io/vintrax/api:latest
          command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
          workingDir: /app/backend
          envFrom:
            - configMapRef: { name: vintrax-config }
            - secretRef: { name: vintrax-secrets }
      containers:
        - name: api
          image: ghcr.io/vintrax/api:latest
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: vintrax-config }
            - secretRef: { name: vintrax-secrets }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: '1', memory: 768Mi }
          # Liveness answers without touching the database, so a slow query
          # cannot trigger a restart loop. Readiness checks dependencies.
          livenessProbe:
            httpGet: { path: /api/health/live, port: 3001 }
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Give in-flight requests and the Prisma pool time to drain.
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: vintrax-api
  namespace: vintrax
spec:
  selector: { app: vintrax-api }
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vintrax-api
  namespace: vintrax
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vintrax-api
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vintrax-api
  namespace: vintrax
spec:
  minAvailable: 2
  selector:
    matchLabels: { app: vintrax-api }
