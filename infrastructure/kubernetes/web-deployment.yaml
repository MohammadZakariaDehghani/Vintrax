apiVersion: apps/v1
kind: Deployment
metadata:
  name: vintrax-web
  namespace: vintrax
  labels: { app: vintrax-web }
spec:
  replicas: 2
  selector:
    matchLabels: { app: vintrax-web }
  template:
    metadata:
      labels: { app: vintrax-web }
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/vintrax-web:sha-REPLACE_ME
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: API_ORIGIN
              value: http://vintrax-api:3001
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities: { drop: ['ALL'] }
---
apiVersion: v1
kind: Service
metadata:
  name: vintrax-web
  namespace: vintrax
spec:
  selector: { app: vintrax-web }
  ports:
    - port: 3000
      targetPort: 3000
