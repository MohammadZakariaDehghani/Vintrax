# Template only. Do NOT commit real secrets — use a sealed-secret controller,
# External Secrets Operator, or your cloud provider's secret manager.
apiVersion: v1
kind: Secret
metadata:
  name: vintrax-secrets
  namespace: vintrax
type: Opaque
stringData:
  DATABASE_URL: postgresql://vintrax:CHANGE_ME@vintrax-postgres:5432/vintrax?schema=public
  # openssl rand -base64 48
  JWT_ACCESS_SECRET: CHANGE_ME
  JWT_REFRESH_SECRET: CHANGE_ME_DIFFERENTLY
  S3_ACCESS_KEY_ID: CHANGE_ME
  S3_SECRET_ACCESS_KEY: CHANGE_ME
  # Resend (documentation/email.md): the API key, and the webhook signing secret.
  RESEND_API_KEY: re_CHANGE_ME
  RESEND_WEBHOOK_SECRET: whsec_CHANGE_ME
  # openssl rand -base64 32 — encrypts secrets saved in the admin.
  SETTINGS_ENCRYPTION_KEY: CHANGE_ME
