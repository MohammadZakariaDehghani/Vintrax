apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vintrax
  namespace: vintrax
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: '12m'
    # Auction bidding uses a WebSocket, which needs a long read timeout or the
    # proxy will cut idle connections between bids.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [vintrax.example.com]
      secretName: vintrax-tls
    # Vintrax Mobile gets its own host rather than a path on the web host: the
    # PWA's manifest scope is "/", and a service worker cannot be registered
    # for a scope above its own path.
    - hosts: [m.vintrax.example.com]
      secretName: vintrax-mobile-tls
  rules:
    - host: vintrax.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vintrax-web
                port: { number: 3000 }
    - host: m.vintrax.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vintrax-mobile
                port: { number: 3002 }
