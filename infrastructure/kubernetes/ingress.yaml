apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vintrax
  namespace: vintrax
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: '12m'
    # Auction bidding uses a WebSocket, which needs a long read timeout or the
    # proxy will cut idle connections between bids.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [vintrax.example.com]
      secretName: vintrax-tls
    # Vintrax Mobile gets its own host rather than a path on the web host: the
    # PWA's manifest scope is "/", and a service worker cannot be registered
    # for a scope above its own path.
    - hosts: [m.vintrax.example.com]
      secretName: vintrax-mobile-tls
  rules:
    - host: vintrax.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          # Uploaded media (make logos, body-type photos, partner logos,
          # vehicle photos) with STORAGE_DRIVER=local. Routed here, the same
          # way infrastructure/nginx/vintrax.conf.example already does,
          # rather than left to fall through to `/` and rely on the web pod's
          # own Next.js rewrite of `/uploads/:path*` — that rewrite depends on
          # the web pod resolving `API_ORIGIN` correctly at its own startup,
          # one more thing that can drift from this ingress's own routing.
          # With STORAGE_DRIVER=s3 nothing under this path is written and the
          # rule is simply unused.
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vintrax-web
                port: { number: 3000 }
    - host: m.vintrax.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /uploads
            pathType: Prefix
            backend:
              service:
                name: vintrax-api
                port: { number: 3001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vintrax-mobile
                port: { number: 3002 }
