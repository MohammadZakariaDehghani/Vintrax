apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: atlas
  namespace: atlas
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: '12m'
    # Auction bidding uses a WebSocket, which needs a long read timeout or the
    # proxy will cut idle connections between bids.
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
spec:
  ingressClassName: nginx
  tls:
    - hosts: [atlas.example.com]
      secretName: atlas-tls
    # Atlas Mobile gets its own host rather than a path on the web host: the
    # PWA's manifest scope is "/", and a service worker cannot be registered
    # for a scope above its own path.
    - hosts: [m.atlas.example.com]
      secretName: atlas-mobile-tls
  rules:
    - host: atlas.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port: { number: 3001 }
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port: { number: 3001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-web
                port: { number: 3000 }
    - host: m.atlas.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port: { number: 3001 }
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: atlas-api
                port: { number: 3001 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: atlas-mobile
                port: { number: 3002 }
