# Blank issues stay on, deliberately.
#
# Atlas has one developer. A template that gets in the way of writing down a
# thought before it is lost costs more than the structure it adds, and an
# unstructured issue can always be filled in later. The templates are there to
# make the good shape easy, not to make the quick note impossible.
blank_issues_enabled: true

contact_links:
