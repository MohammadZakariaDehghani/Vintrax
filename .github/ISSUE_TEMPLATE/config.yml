    url: https://github.com/MohammadZakariaDehghani/Atlas/blob/main/documentation/decision-log.md
    about: Read the decision log before proposing a change to how Atlas is built. Significant decisions are recorded there with their rationale.
  - name: How this project is run
    url: https://github.com/MohammadZakariaDehghani/Atlas/blob/main/documentation/PROJECT_WORKFLOW.md
