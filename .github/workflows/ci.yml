# Pull-request gate.
#
# Pushes to main are covered by release.yml, which runs this same verification
# before it publishes anything — so this workflow deliberately does not trigger
# on push, or every merge would run the suite twice.
name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    # Images are only worth building once the code is known good.
    needs: verify

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: infrastructure/docker/backend.Dockerfile }
          - { name: web, dockerfile: infrastructure/docker/frontend.Dockerfile }
          - { name: mobile, dockerfile: infrastructure/docker/mobile.Dockerfile }

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Built and thrown away: a pull request proves the Dockerfile still works,
      # but nothing from an unreviewed branch belongs in the registry.
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: vintrax-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
