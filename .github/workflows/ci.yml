name: CI

on:
  # Pull requests cover feature branches; limiting push to the default branch
  # stops every PR commit from running the suite twice.
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U atlas -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://atlas:atlas@localhost:5432/atlas_test?schema=public
      # CI-only values; the API refuses the .env.example placeholders in production.
      JWT_ACCESS_SECRET: ci-access-secret-not-used-in-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4

      # No version pin here on purpose: the action reads packageManager from
      # package.json, and specifying both is a hard error.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @atlas/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @atlas/api exec prisma migrate deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify the seed runs and is idempotent
        run: |
          pnpm db:seed
          pnpm db:seed
