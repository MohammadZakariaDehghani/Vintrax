# Publish container images to the GitHub Container Registry, then deploy them.
#
#   GitHub -> CI -> GHCR -> production server: `deploy.sh <sha-tag>`
#
# The production server never builds. It pulls the exact image this workflow
# published, which is the image CI verified — the artefact that was tested is
# the artefact that runs.
#
# Authentication to the registry is GITHUB_TOKEN with `packages: write`, scoped
# to this run and expiring with it. A personal access token in repository
# secrets would be a long-lived registry credential with nothing rotating it, so
# there is not one. The deployment step does need stored credentials, because it
# talks to a machine GitHub knows nothing about; those are listed on the deploy
# job below and documented in documentation/deployment.md.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Not cancel-in-progress: cancelling a half-finished push leaves some of the
  # three images published at a tag and the rest not, which is a deployment
  # that cannot be reasoned about.
  cancel-in-progress: false

# Where the images live, written down once rather than inferred. Both jobs read
# it: publish pushes there, and deploy checks the server pulls from there
# before it runs anything. It must be this repository's owner, lower-cased —
# GITHUB_TOKEN can publish to no other namespace — and publish fails if it is
# not, so moving or forking the repository is a decision someone makes here,
# not a namespace change that happens silently.
env:
  IMAGE_NAMESPACE: variety-project-labs

jobs:
  # The same suite the pull request ran. Nothing is published without it.
  verify:
    uses: ./.github/workflows/verify.yml

  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: verify

    # The tag the deploy job pins. Every leg of the matrix resolves the same
    # value from the same commit, so whichever finishes last writes it and the
    # result is identical either way.
    outputs:
      version: ${{ steps.version.outputs.value }}

    permissions:
      contents: read
      # The only elevated permission this workflow has, and the reason it does
      # not need a stored registry credential.
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, dockerfile: infrastructure/docker/backend.Dockerfile }
          - { name: web, dockerfile: infrastructure/docker/frontend.Dockerfile }
          - { name: mobile, dockerfile: infrastructure/docker/mobile.Dockerfile }

    steps:
      # This repository at the commit that triggered the run — the default,
      # written out because the image tag below is derived from the same SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # GHCR rejects an uppercase path, and a GitHub owner may contain capitals.
      - name: Resolve the image name
        id: image
        env:
          SERVICE: ${{ matrix.name }}
        run: |
          set -euo pipefail
          owner=${GITHUB_REPOSITORY_OWNER,,}
          if [[ $IMAGE_NAMESPACE != "$owner" ]]; then
            echo "::error::IMAGE_NAMESPACE is '$IMAGE_NAMESPACE' but $GITHUB_REPOSITORY belongs to '$owner'."
            echo "GITHUB_TOKEN can publish only to ghcr.io/$owner. Change IMAGE_NAMESPACE at the top of" >&2
            echo "this workflow, and the server's IMAGE_NAMESPACE with it, if the owner really changed." >&2
            exit 1
          fi
          echo "name=ghcr.io/$IMAGE_NAMESPACE/vintrax-$SERVICE" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # sha- is the tag deployments pin and the tag rollback moves between. It
      # is immutable: it names one commit and is never reused, which is exactly
      # what `latest` is not. `latest` is published as a convenience for
      # "whatever main is now" and must never be what a deployment pins, or
      # there is nothing to roll back to.
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # NEXT_PUBLIC_* values and the rewrite destination are compiled into
          # the bundle, so they are fixed here and cannot be changed by the
          # running container. NEXT_PUBLIC_WS_URL is a repository variable
          # because WebSockets cannot go through Next's rewrite proxy and must
          # address the API's public origin directly — set it under
          # Settings -> Secrets and variables -> Actions -> Variables. It is a
          # public URL, not a secret; no secret is ever passed to a build.
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_BRAND_LOGO_SRC=${{ vars.NEXT_PUBLIC_BRAND_LOGO_SRC }}
            API_ORIGIN=http://api:3001

      # Read back out of the tag list rather than recomputed from the commit.
      # `git rev-parse --short` and metadata-action's `format=short` agree today
      # at seven characters, but they are two different rules, and a deployment
      # that pins a tag nobody published fails at `docker pull` on the server
      # rather than here.
      - name: Record the immutable tag this build published
        id: version
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          version=$(printf '%s\n' "$TAGS" | sed -n 's|.*:\(sha-[0-9a-f]\{7,40\}\)$|\1|p' | head -n1)
          if [[ -z $version ]]; then
            echo "::error::this build published no sha- tag, so there is nothing immutable to deploy"
            exit 1
          fi
          # The tag must name the commit this run built, and nothing else.
          if [[ $GITHUB_SHA != "${version#sha-}"* ]]; then
            echo "::error::published $version, which is not this run's commit ($GITHUB_SHA)"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Summarise what was published
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          {
            echo "### ${{ steps.image.outputs.name }}"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Deploy this build by hand, if ever needed:"
            echo '```bash'
            echo "cd /opt/vintrax/scripts && ./deploy.sh $VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # --- Continuous deployment -------------------------------------------------
  #
  # Runs the release step that used to be done by hand, and runs the *same*
  # script the operator ran: `/opt/vintrax/scripts/deploy.sh <sha-tag>`. Nothing
  # is installed on the server, no configuration there is touched, and no second
  # release mechanism is introduced — this job opens an SSH session and types
  # what a person used to type. Running that script by hand keeps working
  # unchanged, and is still the documented way to roll back.
  #
  # It cannot ship a half-published build: `needs: publish` is the whole matrix,
  # and a matrix with any failed leg is a failed dependency, so all three images
  # exist at this tag before the first byte of SSH.
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: publish

    # Tag builds still publish; they do not go out automatically. What this
    # automates is "push to main goes live", and a `v*` tag is a release marker
    # that may be cut from anywhere. Ship one by hand, or dispatch this workflow
    # from main.
    #
    # And only from this repository. A fork, or the repository this one
    # replaced, may still hold the workflow; neither deploys production.
    if: github.ref == 'refs/heads/main' && github.repository == 'variety-project-labs/Vintrax-MarketPlace'

    # Gives this a record in the repository's Environments view, and a place to
    # hang a required reviewer. Adding one there is how the first automatic run
    # is made to pause for a human — see documentation/deployment.md.
    environment: production

    permissions:
      contents: read
      # To confirm the three images exist before going near the server. Read
      # only: this job never publishes.
      packages: read

    # Serialises production releases across every trigger, which the
    # workflow-level group above does not: that one is keyed on the ref, so a
    # push and a manual dispatch are separate groups and could otherwise run
    # `deploy.sh` twice at once against one Docker daemon.
    #
    # Never cancel-in-progress. A cancelled run is one killed somewhere between
    # `prisma migrate deploy` and `compose up`, which is the single worst state
    # to leave this server in.
    concurrency:
      group: vintrax-production-deploy
      cancel-in-progress: false

    env:
      VERSION: ${{ needs.publish.outputs.version }}
      TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
      TARGET_USER: ${{ secrets.DEPLOY_USER }}
      TARGET_PORT: ${{ vars.DEPLOY_PORT || '22' }}
      TARGET_PATH: ${{ vars.DEPLOY_PATH || '/opt/vintrax' }}

    steps:
      - name: Check the configuration is complete
        env:
          TARGET_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          TARGET_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n $TARGET_HOST ]]        || missing+=(DEPLOY_HOST)
          [[ -n $TARGET_USER ]]        || missing+=(DEPLOY_USER)
          [[ -n $TARGET_KEY ]]         || missing+=(DEPLOY_SSH_KEY)
          [[ -n $TARGET_KNOWN_HOSTS ]] || missing+=(DEPLOY_SSH_KNOWN_HOSTS)

          if (( ${#missing[@]} )); then
            echo "::error::missing repository secrets: ${missing[*]}"
            echo "Set them under Settings -> Secrets and variables -> Actions." >&2
            echo "documentation/deployment.md lists each one, including how to" >&2
            echo "produce DEPLOY_SSH_KNOWN_HOSTS with ssh-keyscan." >&2
            exit 1
          fi

          # Both of these end up inside a remote command string, so they are
          # checked rather than trusted. The version is this workflow's own
          # output and the path is a repository variable only an owner can set,
          # but "only an owner can set it" is not the same as "it cannot contain
          # a semicolon".
          [[ $VERSION =~ ^sha-[0-9a-f]{7,40}$ ]] \
            || { echo "::error::refusing to act on '$VERSION' — not an immutable sha- tag"; exit 1; }
          [[ $TARGET_PATH =~ ^/[A-Za-z0-9._/-]*$ ]] \
            || { echo "::error::DEPLOY_PATH '$TARGET_PATH' is not a plain absolute path"; exit 1; }
          [[ $TARGET_PORT =~ ^[0-9]{1,5}$ ]] \
            || { echo "::error::DEPLOY_PORT '$TARGET_PORT' is not a port number"; exit 1; }

          [[ $IMAGE_NAMESPACE =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] \
            || { echo "::error::IMAGE_NAMESPACE '$IMAGE_NAMESPACE' is not a lower-case GHCR owner"; exit 1; }

          echo "Target: $TARGET_USER@$TARGET_HOST:$TARGET_PORT ($TARGET_PATH), version $VERSION"
          echo "Images: ghcr.io/$IMAGE_NAMESPACE/vintrax-{api,web,mobile}:$VERSION"

      # `needs: publish` already means every leg of the matrix succeeded. This
      # asks the registry itself, so an image that is missing at this tag — for
      # whatever reason — stops the job here, before the server is touched.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm all three images are published at this tag
        run: |
          set -euo pipefail
          missing=()
          for service in api web mobile; do
            ref="ghcr.io/$IMAGE_NAMESPACE/vintrax-$service:$VERSION"
            if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
              echo "✓ $ref"
            else
              missing+=("$ref")
            fi
          done
          if (( ${#missing[@]} )); then
            echo "::error::not in the registry: ${missing[*]}. Nothing was deployed."
            exit 1
          fi

      # Preparation is four separate steps rather than one.
      #
      # It used to be a single block beginning `mkdir -p ~/.ssh`, and when it
      # failed the log showed that first line, which reads as though `mkdir`
      # itself had failed. It had not — one of the later commands had, and the
      # UI has no way to say which. Named steps put the failure on the thing
      # that failed.
      #
      # Every one of these ends up holding a credential, so each writes with
      # restrictive permissions and none of them echoes a secret. The only value
      # printed from the key is its *public* fingerprint, which is not secret
      # and is the one thing that makes "Permission denied (publickey)"
      # diagnosable: compare it with the server's authorized_keys.

      - name: Create the SSH directory
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "~/.ssh is ready"

      - name: Write the private key
        env:
          TARGET_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          key=~/.ssh/vintrax_key

          # Written before the permissions are relaxed from the default, so
          # there is no window in which the key is world-readable.
          umask 077

          # Carriage returns are the commonest way a pasted key arrives broken:
          # OpenSSH rejects the file outright and says only "invalid format",
          # which reads like a wrong key rather than a wrong line ending. The
          # trailing newline matters for the same reason — a key whose final
          # -----END----- line is unterminated does not parse.
          printf '%s\n' "$TARGET_KEY" | tr -d '\r' > "$key"
          chmod 600 "$key"

          if [[ ! -s $key ]]; then
            echo "::error::DEPLOY_SSH_KEY wrote an empty file. The secret is set but holds nothing."
            exit 1
          fi

          if ! grep -q -- '-----BEGIN .*PRIVATE KEY-----' "$key"; then
            echo "::error::DEPLOY_SSH_KEY does not look like a private key."
            echo "Paste the whole file, including the BEGIN and END lines — the" >&2
            echo "private key, not the .pub. It is never printed by this job." >&2
            exit 1
          fi

          # Proves the file actually parses, rather than finding out three steps
          # later as an authentication failure. `-P ''` keeps it from prompting:
          # a passphrase-protected key cannot be used unattended, and should
          # fail here saying so rather than hang until the job times out.
          if ! ssh-keygen -y -f "$key" -P '' > ~/.ssh/vintrax_key.pub 2>/tmp/keygen.err; then
            echo "::error::DEPLOY_SSH_KEY could not be read by ssh-keygen."
            echo "Either the key is malformed, or it is protected by a passphrase," >&2
            echo "which cannot be used unattended. Common causes: the file was" >&2
            echo "truncated, re-wrapped by an editor, or is a .pub by mistake." >&2
            # ssh-keygen's own words, which never contain the key material.
            sed 's/^/  ssh-keygen: /' /tmp/keygen.err >&2 || true
            exit 1
          fi

          chmod 600 ~/.ssh/vintrax_key.pub
          echo "Private key parsed. Its public fingerprint:"
          # Public, therefore safe to print, and the fastest way to check the
          # server: this must appear in the deploy user's authorized_keys.
          ssh-keygen -lf ~/.ssh/vintrax_key.pub

      - name: Write the known_hosts file
        env:
          TARGET_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          hosts=~/.ssh/known_hosts
          umask 077
          printf '%s\n' "$TARGET_KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          chmod 600 "$hosts"

          if [[ ! -s $hosts ]]; then
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS wrote an empty file."
            exit 1
          fi

          # Parses the file the way ssh will. A known_hosts that ssh cannot read
          # fails later as "Host key verification failed", which sends everyone
          # looking at the server instead of at the secret.
          if ! ssh-keygen -l -f "$hosts" > /tmp/hostkeys.txt 2>/tmp/hostkeys.err; then
            echo "::error::DEPLOY_SSH_KNOWN_HOSTS is not a valid known_hosts file."
            echo "It should be the raw output of:  ssh-keyscan -p <port> <host>" >&2
            echo "One entry per line. Do not edit or re-wrap the lines." >&2
            sed 's/^/  ssh-keygen: /' /tmp/hostkeys.err >&2 || true
            exit 1
          fi

          echo "known_hosts holds $(wc -l < /tmp/hostkeys.txt) host key(s)."

      - name: Write the SSH client configuration
        run: |
          set -euo pipefail
          umask 077
          # One place for the options, so the connectivity test and the two
          # deploy calls cannot drift apart on which host they reach or how
          # strictly they check it.
          #
          # The host key is pinned from the secret rather than accepted on
          # sight. `ssh-keyscan` at this point would trust whatever answers,
          # which is the whole attack: an impostor that replies once is handed a
          # key with shell access to production.
          {
            echo "Host vintrax-target"
            echo "  HostName $TARGET_HOST"
            echo "  User $TARGET_USER"
            echo "  Port $TARGET_PORT"
            echo "  IdentityFile ~/.ssh/vintrax_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 20"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "SSH client configured for vintrax-target."

      # Nothing is deployed until a harmless command has made the round trip.
      #
      # The point is the diagnosis. Before this, every way of failing arrived as
      # `exit 255` on the deploy step, which says only "ssh gave up" — the same
      # code for a wrong key, a wrong host key, and a server that is simply not
      # answering. ssh reserves 255 for its own failures and passes anything
      # else straight through from the remote command, which is what makes those
      # two cases separable at all.
      - name: Test the SSH connection
        run: |
          set -uo pipefail

          echo "Connecting to the deployment target…"
          output=$(ssh -T -o BatchMode=yes -o StrictHostKeyChecking=yes \
                     vintrax-target 'echo SSH connection successful' 2>&1) && rc=0 || rc=$?

          # GitHub masks every registered secret in log output, so the host and
          # user appear as *** here. The classification below is what is
          # actually useful; the raw text is kept for the cases nobody predicted.
          echo "::group::ssh output"
          printf '%s\n' "$output"
          echo "::endgroup::"

          if (( rc == 0 )); then
            if printf '%s\n' "$output" | grep -q 'SSH connection successful'; then
              echo "SSH connection successful."
              exit 0
            fi
            echo "::error::ssh succeeded but the test command produced no output."
            exit 1
          fi

          # Anything that is not 255 came back from the remote shell, so ssh
          # itself connected and authenticated.
          if (( rc != 255 )); then
            echo "::error::REMOTE COMMAND FAILURE — connected and authenticated, but the test command exited $rc."
            echo "The login itself works. Something in the deploy user's shell profile" >&2
            echo "is failing or writing to stderr on login." >&2
            exit 1
          fi

          if printf '%s\n' "$output" | grep -qiE 'host key verification failed|remote host identification has changed|no matching host key'; then
            echo "::error::HOST-KEY VERIFICATION — the server's key is not the one in DEPLOY_SSH_KNOWN_HOSTS."
            echo "Regenerate it from a machine that already trusts the server:" >&2
            echo "    ssh-keyscan -p <port> <host>" >&2
            echo "The entry has to match how this job addresses the server. DEPLOY_HOST" >&2
            echo "must be spelled the same way — a key scanned for the DNS name does not" >&2
            echo "verify a connection made to the IP address, or the other way round." >&2
            echo "On a non-default port the entry is [host]:port." >&2
          elif printf '%s\n' "$output" | grep -qiE 'permission denied|no supported authentication|too many authentication|authentication failed'; then
            echo "::error::AUTHENTICATION — the server refused this key."
            echo "The public fingerprint printed by the 'Write the private key' step" >&2
            echo "must appear in ~/.ssh/authorized_keys for DEPLOY_USER on the server." >&2
            echo "Check DEPLOY_USER is the account that actually holds it." >&2
          elif printf '%s\n' "$output" | grep -qiE 'invalid format|error in libcrypto|bad permissions|unprotected private key'; then
            echo "::error::AUTHENTICATION — the private key was rejected before it was offered."
            echo "DEPLOY_SSH_KEY is malformed. Re-copy the whole file." >&2
          elif printf '%s\n' "$output" | grep -qiE 'could not resolve|name or service not known|nodename nor servname'; then
            echo "::error::CONNECTION — DEPLOY_HOST does not resolve."
          elif printf '%s\n' "$output" | grep -qiE 'connection timed out|operation timed out|connection refused|no route to host|network is unreachable'; then
            echo "::error::CONNECTION — could not reach the server on that host and port."
            echo "Check DEPLOY_HOST and DEPLOY_PORT, and that the server's firewall" >&2
            echo "accepts SSH from GitHub's runners." >&2
          else
            echo "::error::SSH FAILED (exit 255) — see the ssh output above."
          fi
          exit 1

      # The server pulls whatever its own compose file and environment file
      # name, which this workflow does not control. This asks it, read-only,
      # which images it would pull for this version and whether it is allowed
      # to read them. A namespace that disagrees with IMAGE_NAMESPACE above then
      # fails here, naming both, instead of as "not found" inside deploy.sh.
      # `compose config --images` prints image references only, never a value
      # from the environment file; `docker manifest inspect` downloads nothing.
      - name: Check the server pulls the images this run published
        if: success()
        run: |
          set -uo pipefail

          expected=$(for service in api web mobile; do
                       echo "ghcr.io/$IMAGE_NAMESPACE/vintrax-$service:$VERSION"
                     done | sort)

          output=$(ssh -T vintrax-target \
                     "VINTRAX_VERSION='$VERSION' docker compose --env-file '$TARGET_PATH/env/vintrax.env' -f '$TARGET_PATH/compose/docker-compose.prod.yml' config --images" 2>&1) \
            && rc=0 || rc=$?
          if (( rc != 0 )); then
            # Not printed: a parse error from compose can quote the environment
            # file, which holds production credentials.
            echo "::error::could not read the image names from the server's compose file (exit $rc). Nothing was deployed."
            echo "To see why, run on the server:" >&2
            echo "  VINTRAX_VERSION=$VERSION docker compose --env-file $TARGET_PATH/env/vintrax.env -f $TARGET_PATH/compose/docker-compose.prod.yml config --images" >&2
            exit 1
          fi

          actual=$(printf '%s\n' "$output" | grep -E '/vintrax-(api|web|mobile):' | sort -u || true)
          echo "This run published:"
          printf '%s\n' "$expected" | sed 's/^/  /'
          echo "The server would pull:"
          printf '%s\n' "${actual:-(no vintrax images)}" | sed 's/^/  /'

          if [[ $actual != "$expected" ]]; then
            echo "::error::IMAGE NAMESPACE MISMATCH — the server would pull images this run did not publish. Nothing was deployed."
            echo "Set IMAGE_NAMESPACE=$IMAGE_NAMESPACE (and no REGISTRY other than ghcr.io) in" >&2
            echo "$TARGET_PATH/env/vintrax.env on the server, keeping a copy of the file first." >&2
            echo "documentation/repository-migration.md § 3 has the exact commands." >&2
            exit 1
          fi

          failed=false
          for ref in $expected; do
            err=$(ssh -T vintrax-target "docker manifest inspect '$ref'" 2>&1 > /dev/null) && rc=0 || rc=$?
            if (( rc == 0 )); then
              echo "✓ the server can read $ref"
              continue
            fi
            failed=true
            if (( rc == 255 )); then
              echo "::error::the SSH session failed while checking $ref."
            elif printf '%s\n' "$err" | grep -qiE 'unauthorized|denied|authentication required'; then
              echo "::error::REGISTRY ACCESS — the server is not allowed to read $ref."
              echo "On the server, as $TARGET_USER: docker login ghcr.io with a token that can read" >&2
              echo "the $IMAGE_NAMESPACE packages (read:packages). documentation/docker.md § 3.6." >&2
            else
              echo "::error::the server could not read $ref:"
              printf '  %s\n' "$err" >&2
            fi
          done
          [[ $failed == false ]] || exit 1

      # The release itself. One command, the existing one.
      #
      # `-T` asks for no terminal, which is not cosmetic: the scripts disable
      # their colour codes when stdout is not a tty, so the Actions log reads as
      # text rather than as escape sequences.
      #
      # ssh exits with the remote command's status, so a failed migration or a
      # service that never becomes healthy fails this job. deploy.sh does not
      # revert on its own — a failed run may have applied a migration — so a red
      # job here means a person looks, exactly as before.
      #
      # `if: success()` is the default, and is written out anyway. It is the
      # rule that matters most in this job — nothing reaches the server unless
      # the key parsed, the known_hosts parsed, and a round trip succeeded — and
      # a later edit adding `continue-on-error` to a step above would silently
      # revoke it. Stated explicitly, it is also something a test can assert.
      - name: Run the existing deploy script
        if: success()
        run: |
          # `-e` is deliberately absent: the exit status is carried by hand so
          # the log group still closes on a failure. Under `set -e` the step
          # would abort at the ssh line and leave the group open, collapsing the
          # very output someone needs to read when a release goes wrong.
          set -uo pipefail

          echo "::group::deploy.sh $VERSION"
          ssh -T vintrax-target "cd '$TARGET_PATH/scripts' && ./deploy.sh '$VERSION'"
          status=$?
          echo "::endgroup::"

          if (( status == 255 )); then
            # Connectivity was proven a step ago, so 255 here means the session
            # dropped part-way rather than never opening.
            echo "::error::the SSH session failed during deployment (255). The connection" \
                 "test passed, so this is a session that dropped mid-run — the server may be" \
                 "part-way through. Check it before deploying again."
          elif (( status != 0 )); then
            echo "::error::deploy.sh exited $status on the server. Read its output above:" \
                 "it says which stage failed and what to do. Nothing is reverted automatically."
          fi
          exit $status

      # Asks the server what it believes is running, rather than assuming the
      # previous step's exit code covered it. `--list` is read-only and part of
      # the script that is already there.
      - name: Confirm the server is running this version
        if: success()
        run: |
          set -euo pipefail
          echo "::group::deploy.sh --list"
          listing=$(ssh -T vintrax-target "cd '$TARGET_PATH/scripts' && ./deploy.sh --list")
          printf '%s\n' "$listing"
          echo "::endgroup::"

          # Anchored to the end of the line. `grep -F` on its own would also
          # accept a longer version that merely starts with this one. VERSION
          # was validated as ^sha-[0-9a-f]+$ above, so it holds no regex
          # metacharacters.
          if ! printf '%s\n' "$listing" | grep -qE "^[[:space:]]*current:[[:space:]]+${VERSION}[[:space:]]*$"; then
            echo "::error::the server reports a different current version than $VERSION"
            exit 1
          fi
          echo "Confirmed: the server is running $VERSION"

      # Runners are ephemeral, so this is belt and braces rather than the only
      # thing standing between the key and the next job. It costs nothing, and
      # it means the credential is not sitting on disk while the later steps run.
      - name: Remove the private key from the runner
        if: always()
        run: |
          set -uo pipefail
          rm -f ~/.ssh/vintrax_key ~/.ssh/vintrax_key.pub
          echo "Key material removed from the runner."

      - name: Summarise
        if: always()
        run: |
          set -uo pipefail
          {
            echo "### Production"
            echo
            if [[ "${{ job.status }}" == success ]]; then
              echo "\`$VERSION\` is live on \`$TARGET_HOST\`."
            else
              echo "\`$VERSION\` did **not** finish. The server may still be on the previous"
              echo "version, or may be part-way through — read the log above before acting."
            fi
            echo
            echo "Reverting uses the mechanism that was already there, from the server:"
            echo
            echo '```bash'
            echo "ssh $TARGET_USER@$TARGET_HOST"
            echo "cd $TARGET_PATH/scripts"
            echo "./rollback.sh --list     # what it can go back to"
            echo "./rollback.sh            # the previous version"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
